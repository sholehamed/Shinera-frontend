<div
    class="cta-area ptb-150"
    [class.component-rtl-enabled]="themeService.isRTLEnabledTheme()"
>
    <div class="container position-relative z-1">

        <div class="cta-content text-center ml-auto mr-auto">

            <div class="cta-badge">
                <i class="material-symbols-outlined">
                    auto_awesome
                </i>

                <span>
                    آماده‌ای کسب‌وکارت را بهتر مدیریت کنی؟
                </span>
            </div>

            <h2>
                مدیریت زیبایی کسب‌وکارت،
                <span>ساده‌تر با Shinera</span>
            </h2>

            <p>
                ابزارهای مورد نیازت را در یک فضای یکپارچه داشته باش
                و با تمرکز بیشتر، کسب‌وکارت را مدیریت کن.
            </p>

            <div class="cta-actions">

                <a
                    routerLink="/dashboard"
                    mat-button
                    class="primary-action"
                >
                    شروع کار با Shinera

                    <i class="material-symbols-outlined">
                        arrow_back
                    </i>
                </a>

                <a
                    href="#"
                    mat-button
                    class="secondary-action"
                >
                    بیشتر درباره Shinera

                    <i class="material-symbols-outlined">
                        north_east
                    </i>
                </a>

            </div>

        </div>

        <div class="shape1">
            <img
                src="images/front-pages/shape1.png"
                alt=""
            >
        </div>

        <div class="shape2">
            <img
                src="images/front-pages/shape2.png"
                alt=""
            >
        </div>

    </div>
</div>

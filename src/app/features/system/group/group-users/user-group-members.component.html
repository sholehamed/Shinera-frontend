
<app-page-header/>
 <div class="bulk-actions" *ngIf="selection.selected.length > 0">
      <span>{{ selection.selected.length }} مورد انتخاب شده</span>
      <span class="spacer"></span>

      <button mat-flat-button color="warn" type="button" (click)="removeSelected()" [disabled]="loading()">
        <mat-icon>delete</mat-icon>
        حذف انتخاب‌شده‌ها
      </button>

      <button mat-button type="button" (click)="selection.clear()" [disabled]="loading()">پاک کردن انتخاب</button>
    </div>
<app-grid #grid
  [columns]="columns"
  [data]="list()"
  [enableActions]="true"
  [enableSelection]="true"
  
  (queryChange)="load($event)"
>
 <ng-template gridCellTemplate="logo" let-value="value">
      <app-avatar-upload   [value]="value" [refresh]="false"  [editable]="false"  [size]="60"> </app-avatar-upload>
            
    </ng-template>

 <ng-template #HeaderActions>
                 <button 
                        class="add-btn refined-add-btn"
                        type="button"
                        (click)="openBulkAdd()"
                        mat-button>
                        <i class="material-symbols-outlined">add</i>
                        جدید
                    </button>
             
             
        </ng-template>
        <ng-template gridCellTemplate="avatar" let-value="value">
      <app-avatar-upload   [value]="value" [refresh]="false"  [editable]="false"  [size]="60"> </app-avatar-upload>
            
    </ng-template>
<ng-template #actionTemplate let-row>
               
    </ng-template>
</app-grid>

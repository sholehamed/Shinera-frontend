<app-page-header />

<form [formGroup]="userForm" (ngSubmit)="Submit()" >
    <div class="row">
        <div class="col-lg-12">
            <mat-card class="add-user-card mb-25 border-radius d-block bg-white border-0 shadow-none">
                <mat-card-content>
                    <div class="row " style="margin-top: 10px;">
                        <app-custom-select [validationErrors]="[{type:'required',message:'منبع  الزامی میباشد'}]" [searchable]="true" (searchChanged)="searchModule($event)" placeholder="منبع"  [options]="resources()" controlName="resourceId" label="منبع"></app-custom-select>
                            <app-custom-input [validationErrors]="[{type:'required',message:'کد  الزامی میباشد'}]" class="col-sm-4" appNoAutofill  type="text"  label="کد"   controlName="key"></app-custom-input> 
                            <app-custom-input [validationErrors]="[{type:'required',message:'عنوان  الزامی میباشد'}]" class="col-sm-4"   type="text"  label="عنوان" controlName="title"></app-custom-input>
                            <app-custom-select  placeholder="نوع متود" [autoSelectFirst]="true"  [options]="httpMethods" controlName="httpMethod" label="نوع متود"></app-custom-select>
                            <app-custom-input [validationErrors]="[{type:'required',message:'قالب مسیر  الزامی میباشد'}]" class="col-sm-4"   type="text"  label="قالب مسیر" controlName="routeTemplate"></app-custom-input>
                            <app-custom-select [validationErrors]="[{type:'required',message:' سورس  الزامی میباشد'}]" class="col-sm-4"  placeholder="سورس" [autoSelectFirst]="true"  [options]="sources" controlName="source" label="سورس"></app-custom-select>
                        </div>
                        <div class="row">
                            <app-custom-text-erea class="col-sm-12"   type="text"  label="توضیحات" controlName="description"></app-custom-text-erea>     
                        </div>
                        <div class="row">
                            <app-custom-toggle class="col-sm-4"  label="دسترسی ناشناس"   controlName="allowAnonymous">   </app-custom-toggle>
                            <app-custom-toggle class="col-sm-4"  label="خارج از رده"   controlName="isDeprecated">   </app-custom-toggle>
                            <app-custom-toggle class="col-sm-4"  label="فعال است"   controlName="isActive">   </app-custom-toggle>
                    </div>
                     <div class="form-btn-box">
                <button type="submit" [disabled]="userForm.invalid" mat-button color="primary" >
                    <i class="material-symbols-outlined">
                        save
                    </i>
                    ذخیره
                </button>
                <button (click)="back()" type="button" mat-button color="warn">
                    لغو
                </button>
            </div>
                </mat-card-content>
            </mat-card>
        </div>
     
    </div>
</form>

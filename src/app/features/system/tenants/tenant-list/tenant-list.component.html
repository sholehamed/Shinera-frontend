<app-page-header/>

<app-grid #grid
  [columns]="columns"
  [data]="list()"
  [enableActions]="true"
  [enableSelection]="true"
  (queryChange)="loadUsers($event)"
>
 <ng-template gridCellTemplate="logo" let-value="value">
      <app-avatar-upload   [value]="value" [refresh]="false"  [editable]="false"  [size]="60"> </app-avatar-upload>
            
    </ng-template>
<ng-template gridHeaderFilterTemplate="name">
    <app-text-filter [grid]="grid" field="name" label="جستجوی نام "></app-text-filter>
  </ng-template>
<ng-template [gridHeaderFilterTemplate]="'slug'">
    <app-text-filter [grid]="grid" field="slug" label="جستجوی اسم مستعار"></app-text-filter>
</ng-template>
<ng-template [gridCellTemplate]="'isActive'" let-value="value" let-row="row">
    <app-cell-toggle (toggleChanged)="changeState(row.id)"  [value]="value" ></app-cell-toggle>
</ng-template>
 <ng-template #HeaderActions>
            <button
                    class="add-btn refined-add-btn"
                    type="button"
                    routerLink="create"
                    mat-button>
                    <i class="material-symbols-outlined">add</i>
                    جدید
                </button>
        </ng-template>
        <ng-template gridCellTemplate="imageId" let-value="value">
      <app-avatar-upload   [value]="value" [refresh]="false"  [editable]="false"  [size]="60"> </app-avatar-upload>
            
    </ng-template>
<ng-template #actionTemplate let-row>
        <button
            mat-button
            [matMenuTriggerFor]="actionMenu"
            class="dot-menu p-0 d-inline-block border-radius-0"
        >
            <i class="ri-more-fill"></i>
        </button>

        <mat-menu #actionMenu="matMenu" class="card-header-menu" xPosition="before">
          
             <button [routerLink]="row.id+'/users'" mat-menu-item type="button" >
                مدیریت کاربران
            </button>
            <button [routerLink]="row.id+'/detail'" mat-menu-item type="button" >
                جزئیات
            </button>

            <button mat-menu-item [routerLink]="row.id+'/edit'" type="button" >
                ویرایش
            </button>

            <button mat-menu-item type="button" >
                حذف
            </button>
        </mat-menu>
    </ng-template>
</app-grid>

<app-page-header/>

<app-grid #grid
  [columns]="columns"
  [data]="list()"
  [enableActions]="false"
  [enableSelection]="true"
  (selectedIdsChange)="idsChanged($event)"
  (queryChange)="loadUsers($event)"
>
 <ng-template gridCellTemplate="logo" let-value="value">
      <app-avatar-upload   [value]="value" [refresh]="false"  [editable]="false"  [size]="60"> </app-avatar-upload>
            
    </ng-template>
<ng-template gridHeaderFilterTemplate="firstName">
    <app-text-filter [grid]="grid" field="firstName" label="جستجوی نام "></app-text-filter>
  </ng-template>
  <ng-template gridHeaderFilterTemplate="lastName">
    <app-text-filter [grid]="grid" field="lastName" label="جستجوی نام خانوادگی "></app-text-filter>
  </ng-template>
<ng-template [gridHeaderFilterTemplate]="'userName'">
    <app-text-filter [grid]="grid" field="userName" label="جستجوی  نام کاربری"></app-text-filter>
</ng-template>
<ng-template [gridCellTemplate]="'isActive'" let-value="value">
    {{ value ? 'فعال' : 'غیرفعال' }}
</ng-template>
<ng-template [gridCellTemplate]="'isLockedOut'" let-value="value">
    {{ value ? 'قفل' : 'باز' }}
</ng-template>
 <ng-template #HeaderActions>
              @if(dialogData&& dialogData.isModal==true){
                 <button 
                        class="add-btn refined-add-btn"
                        type="button"
                        (click)="closeDialog()"
                        mat-button>
                        <i class="material-symbols-outlined">save</i>
                        بستن
                    </button>
             }
        </ng-template>
        <ng-template gridCellTemplate="avatar" let-value="value">
      <app-avatar-upload   [value]="value" [refresh]="false"  [editable]="false"  [size]="60"> </app-avatar-upload>
            
    </ng-template>
<ng-template #actionTemplate let-row>
                 @if(dialogData&& dialogData.isModal==false){
                     <button
                         mat-button
                         [matMenuTriggerFor]="actionMenu"
                         class="dot-menu p-0 d-inline-block border-radius-0"
                     >
                         <i class="ri-more-fill"></i>
                     </button>
                 
                }

        <mat-menu #actionMenu="matMenu" class="card-header-menu" xPosition="before">

            <button mat-menu-item [routerLink]="row.id+'/edit'" type="button" >
                ویرایش
            </button>

            <button mat-menu-item type="button" >
                حذف
            </button>
        </mat-menu>
    </ng-template>
</app-grid>

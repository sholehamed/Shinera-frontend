<mat-card
    class="menus-card mb-25 border-radius d-block bg-white border-0 shadow-none refined-table-card"
    [class.component-rtl-enabled]="themeService.isRTLEnabledTheme()"
>
    <mat-card-header class="refined-card-header">
        <mat-card-title class="refined-card-title" style="margin-left: 20px;">
            {{ title }}
        </mat-card-title>

        <mat-card-subtitle *ngIf="enableSearch" class="refined-card-search">
            <div class="refined-search-actions-row">
                <form class="search-box refined-search-box position-relative">
                    <input
                        #input
                        type="text"
                        class="input-search refined-input-search"
                        placeholder="جستجو ..."
                        (keyup)="applyFilter($event)"
                    />

                    <label>
                        <i class="material-symbols-outlined">search</i>
                    </label>
                </form>

                <div class="refined-header-actions">
                    <ng-template *ngTemplateOutlet="HeaderActions"></ng-template>
                </div>
            </div>
        </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content class="refined-card-content">
        <div class="table-style-five refined-table-wrapper">
            <div class="table-responsive">
                <table mat-table [dataSource]="dataSource" class="refined-table">
                    <ng-container matColumnDef="select" *ngIf="enableSelection">
                        <th mat-header-cell *matHeaderCellDef class="select-column">
                            <mat-checkbox
                                (change)="toggleAllRows()"
                                [checked]="selection.hasValue() && isAllSelected()"
                                [indeterminate]="selection.hasValue() && !isAllSelected()"
                                [aria-label]="checkboxLabel()"
                            ></mat-checkbox>
                        </th>

                        <td mat-cell *matCellDef="let row" class="select-column">
                            <mat-checkbox
                                (click)="$event.stopPropagation()"
                                (change)="toggleRow(row)"
                                [checked]="isRowSelected(row)"
                                [aria-label]="checkboxLabel(row)"
                            ></mat-checkbox>
                        </td>
                    </ng-container>

                    <ng-container
                        *ngFor="let column of columns"
                        [matColumnDef]="column.key.toString()"
                    >
                        <th mat-header-cell *matHeaderCellDef>
                            <div class="grid-header-cell">
                                <span>
                                    {{ column.label }}
                                </span>

                                <ng-container *ngIf="getHeaderFilterTemplate(column.key) as filterTemplate">
                                    <button
                                        mat-button
                                        type="button"
                                        class="grid-header-filter-btn"
                                        [matMenuTriggerFor]="filterMenu"
                                        (click)="$event.stopPropagation()"
                                    >
                                        <i class="material-symbols-outlined">filter_alt</i>
                                    </button>

                                    <mat-menu #filterMenu="matMenu" class="grid-header-filter-menu">
                                        <div
                                            class="grid-header-filter-content"
                                            (click)="$event.stopPropagation()"
                                        >
                                            <ng-container
                                                *ngTemplateOutlet="
                                                    filterTemplate;
                                                    context: {
                                                        column: column,
                                                        key: column.key
                                                    }
                                                "
                                            ></ng-container>
                                        </div>
                                    </mat-menu>
                                </ng-container>
                            </div>
                        </th>

                        <td
                            mat-cell
                            *matCellDef="let element; let rowIndex = index"
                            [ngClass]="column.className"
                        >
                            <ng-container *ngIf="getCellTemplate(column.key.toString()) as customTemplate; else defaultCell">
                                <ng-container
                                    *ngTemplateOutlet="
                                        customTemplate;
                                        context: {
                                            $implicit: element,
                                            row: element,
                                            value: getCellValue(element, column.key.toString()),
                                            column: column,
                                            index: rowIndex
                                        }
                                    "
                                ></ng-container>
                            </ng-container>

                            <ng-template #defaultCell>
                                <ng-container [ngSwitch]="column.type">
                                    <ng-container *ngSwitchCase="'image-text'">
                                        <div class="customer-info d-flex align-items-center refined-customer-info">
                                            <div class="img refined-avatar">
                                                <img
                                                    [src]="getCellValue(element, column.key.toString())"
                                                    class="product-image"
                                                    alt="grid-image"
                                                />
                                            </div>

                                            <span class="d-block fw-semibold">
                                                {{ getCellValue(element, column.key.toString() + '.name') }}
                                            </span>
                                        </div>
                                    </ng-container>

                                    <ng-container *ngSwitchCase="'currency'">
                                        <span class="currency-value">
                                            ${{ getCellValue(element, column.key.toString()) }}
                                        </span>
                                    </ng-container>

                                    <ng-container *ngSwitchDefault>
                                        {{ getCellValue(element, column.key.toString()) }}
                                    </ng-container>
                                </ng-container>
                            </ng-template>
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="action" *ngIf="enableActions">
                        <th mat-header-cell *matHeaderCellDef class="action-column"></th>

                        <td mat-cell *matCellDef="let element" class="action-column">
                            <ng-container
                                *ngTemplateOutlet="actionTemplate; context: { $implicit: element }"
                            ></ng-container>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

                    <tr class="mat-row refined-empty-row" *matNoDataRow>
                        <td class="mat-cell" [attr.colspan]="displayedColumns.length">
                            No data found
                        </td>
                    </tr>
                </table>
            </div>

            <mat-paginator
                class="refined-paginator"
                [length]="totalCount"
                [pageSize]="pageSize"
                [pageIndex]="currentPageIndex"
                [pageSizeOptions]="pageSizeOptions"
                showFirstLastButtons
                (page)="onPageChange($event)"
            ></mat-paginator>
        </div>
    </mat-card-content>
</mat-card>
